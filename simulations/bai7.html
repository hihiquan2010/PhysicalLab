<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 7: Hiện tượng cộng hưởng</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div id="sidebar">
      <a href="../index.html" class="btn-back"
        ><i class="fa-solid fa-arrow-left"></i> Trở về Trang Chủ</a
      >
      <h2>Bài 7: Cộng hưởng</h2>
      <div class="instructions">
        <strong>Hướng dẫn:</strong><br />
        Thay đổi tần số ngoại lực \(f\) và tần số riêng \(f_0\). Quan sát điểm
        sáng trên đồ thị. Khi \(f = f_0\), biên độ đạt cực đại (Cộng hưởng).
      </div>
      <div class="control-group">
        <label>Tần số ngoại lực (f): <span id="val-f">2.0 Hz</span></label>
        <input
          type="range"
          id="slider-f"
          min="0.5"
          max="4.0"
          step="0.1"
          value="2.0"
        />
      </div>
      <div class="control-group">
        <label>Tần số riêng (f₀): <span id="val-f0">2.0 Hz</span></label>
        <input
          type="range"
          id="slider-f0"
          min="1.0"
          max="3.0"
          step="0.1"
          value="2.0"
        />
      </div>
      <div class="control-group">
        <label>Lực cản (c): <span id="val-c">0.3</span></label>
        <input
          type="range"
          id="slider-c"
          min="0.1"
          max="1.0"
          step="0.1"
          value="0.3"
        />
      </div>
    </div>
    <div id="main-content">
      <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
      </div>
    </div>
    <script src="../js/sim7.js"></script>
  </body>
</html>
